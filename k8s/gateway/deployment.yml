apiVersion: apps/v1
kind: Deployment

metadata:
  name: gateway-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: gateway-service

  template:
    metadata:
      labels:
        app: gateway-service

    spec:
      containers:
        - name: gateway-service

          image: crudgyl-gateway-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: gateway-config