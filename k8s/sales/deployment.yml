apiVersion: apps/v1
kind: Deployment

metadata:
  name: sales-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: sales-service

  template:
    metadata:
      labels:
        app: sales-service

    spec:
      containers:
        - name: sales-service

          image: crudgyl-sales-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: sales-config

            - secretRef:
                name: sales-secret