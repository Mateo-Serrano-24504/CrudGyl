apiVersion: apps/v1
kind: Deployment

metadata:
  name: products-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: products-service

  template:
    metadata:
      labels:
        app: products-service

    spec:
      containers:
        - name: products-service

          image: crudgyl-products-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: products-config

            - secretRef:
                name: products-secret